# Kurulum dosyasını yönlendirmesiz bir adresten yayınlar (GitHub Pages, gh-pages dalı).
#
# Neden: GitHub release indirme bağlantıları 302 ile geçici bir depolama adresine yönlendirir.
# Sitenin indirme düğmesi (ve olası paket yöneticileri) yönlendirmesiz, sürüme özel ve değişmeyen bir bağlantı ister:
#   https://shockconvert.suleymankara.com/download/vX.Y.Z/shock-convert-setup-X.Y.Z.exe
#
# Tetikleme: "build" iş akışı bir sürüm yayınlayınca onu çağırır (workflow_call), ya da elle
# (eski bir sürümü yayınlamak için) "Run workflow" ile etiket girilerek.
# Bir sürümün dosyası bir kez yayınlandıktan sonra değiştirilmez (bağlantı ve SHA-256 sabit kalmalı).
#
# Bir kerelik ayar: Settings → Pages → Source: "Deploy from a branch", Branch: gh-pages / (root).
# Özel alan adı bağlı olduğu için github.io adresleri ona yönlenir; özet, gh-pages dalındaki CNAME
# dosyasından doğru adresi yazar.

name: publish-download

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Yayınlanacak sürüm etiketi (ör. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # site iş akışıyla aynı dala (gh-pages) yazdığı için aynı kuyrukta sırayla çalışır.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Etiketi doğrula
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Geçersiz sürüm etiketi: '$TAG' (beklenen: vX.Y.Z)"; exit 1
          fi

      - name: gh-pages dalını hazırla
        run: |
          git init -q site
          cd site
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin gh-pages; then
            git checkout -q -b gh-pages FETCH_HEAD
          else
            git checkout -q --orphan gh-pages
          fi
          touch .nojekyll

      - name: Kurulum dosyasını indir
        run: |
          dest="site/download/${TAG}"
          if compgen -G "${dest}/shock-convert-setup-*.exe" > /dev/null; then
            echo "${TAG} zaten yayınlanmış; değiştirilmiyor."
            exit 0
          fi
          mkdir -p "$dest"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'shock-convert-setup-*.exe' -D "$dest"
          (cd "$dest" && sha256sum shock-convert-setup-*.exe > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Yayınla
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Sitenin indirme düğmesi için en yüksek yayınlanmış sürüm (eski bir sürüm sonradan
          # yayınlansa bile latest.json en yenisini gösterir).
          latest=$(find download -mindepth 1 -maxdepth 1 -type d -name 'v*' -printf '%f\n' | sed 's/^v//' | sort -V | tail -1)
          setup=$(cd "download/v${latest}" && ls shock-convert-setup-*.exe)
          sha=$(cut -d' ' -f1 "download/v${latest}/SHA256SUMS.txt")
          printf '{"version":"%s","setup":"%s","sha256":"%s"}\n' "$latest" "$setup" "$sha" > download/latest.json
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -q -m "İndirme: ${TAG}"
            git push -q origin gh-pages
          fi
          file=$(cd "download/${TAG}" && ls shock-convert-setup-*.exe)
          echo "Kurulum dosyasının sabit bağlantısı:" >> "$GITHUB_STEP_SUMMARY"
          if [ -s CNAME ]; then
            base="https://$(tr -d '[:space:]' < CNAME)"
          else
            base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          echo "${base}/download/${TAG}/${file}" >> "$GITHUB_STEP_SUMMARY"
