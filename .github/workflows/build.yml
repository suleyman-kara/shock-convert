name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: cargo test --workspace
      - run: cargo check --workspace --target x86_64-pc-windows-gnu

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write # etiketlenen sürümde Release oluşturmak için
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: İkon ve sürüm bilgisi exe'ye gömülmüş mü
        shell: pwsh
        run: |
          $info = (Get-Item target/release/shock-convert.exe).VersionInfo
          if ($info.ProductName -ne "Shock Convert") {
            throw "Kaynak (ikon/surum) exe'ye gomulmemis: ProductName='$($info.ProductName)'"
          }
          if ($info.CompanyName -ne "Suleyman Kara") {
            throw "Yayinci adi yanlis: CompanyName='$($info.CompanyName)'"
          }
          Write-Host "Gomulu kaynak tamam: $($info.ProductName) $($info.FileVersion)"
      - name: Office PDF betiği (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $path = "crates/cli/src/pdf/msoffice.ps1"
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$null, [ref]$errors)
          if ($errors) { $errors | Out-String | Write-Host; throw "msoffice.ps1 sozdizimi hatali" }
          # Office yokken (CI) hata yolu: betik hata dosyasini yazip 1 ile cikmali, asili kalmamali.
          $env:SC_IN = "C:\yok.docx"; $env:SC_OUT = "$env:RUNNER_TEMP\out.pdf"; $env:SC_APP = "Word"
          $env:SC_PROGID = "ShockConvert.YokBoyleBirUygulama"; $env:SC_PROC = "YOKBOYLE"
          $env:SC_ERR = "$env:RUNNER_TEMP\err.txt"; $env:SC_PIDS = "$env:RUNNER_TEMP\pids.txt"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $path
          if ($LASTEXITCODE -ne 1) { throw "beklenen cikis kodu 1, gelen $LASTEXITCODE" }
          if (-not (Test-Path $env:SC_ERR)) { throw "hata dosyasi yazilmadi" }
          Write-Host "Hata yolu tamam: $(Get-Content $env:SC_ERR)"
      - name: Kurulum sihirbazı (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path crates/cli/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\shock-convert.iss
      - uses: actions/upload-artifact@v4
        with:
          name: shock-convert-windows
          path: |
            dist/*.exe
            target/release/shock-convert.exe

      - name: GitHub Release (yalnızca v* etiketinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/shock-convert-setup-*.exe
            target/release/shock-convert.exe
