name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: cargo test --workspace
      - run: cargo check --workspace --target x86_64-pc-windows-gnu

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Kurulum sihirbazı (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path crates/cli/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\shock-convert.iss
      - uses: actions/upload-artifact@v4
        with:
          name: shock-convert-windows
          path: |
            dist/*.exe
            target/release/shock-convert.exe
