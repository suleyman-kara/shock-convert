# Derleme, test ve otomatik sürüm.
#
#   PR (bu repodan)    -> "pr-N" ön sürümü (pre-release): PR'ın kurulum dosyası, her push'ta yenilenir,
#                         PR kapanınca silinir (pr-cleanup.yml). Sürüm: X.Y.Z-pr.N
#   main'e birleştirme -> vX.Y.Z kararlı sürüm + GitHub Pages indirme bağlantısı (publish-download.yml).
#                         Sürüm kuralları .github/scripts/next-version.sh içinde (yama artışı;
#                         release:minor / release:major / release:skip PR etiketleri).
#   Elle itilen v* etiketi -> o sürüm (eski yol; mevcut release'e dosya eklenir).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# PR'da yeni push eskisini iptal eder; main'deki sürümler sırayla çıkar (aynı numara iki kez verilmesin).
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      kind: ${{ steps.v.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # etiketler ve son sürümden bu yana değişen dosyalar için
      - name: Birleştirilen PR'ın etiketleri
        id: labels
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'list<<EOF'
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].labels[]?.name' || true
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Sürüm
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || steps.labels.outputs.list }}
        run: |
          bash .github/scripts/next-version.sh
          cat "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: cargo test --workspace
      - run: cargo check --workspace --target x86_64-pc-windows-gnu

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site

  windows:
    needs: [version, test]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Sürümü yaz (yalnızca bu derlemede; repoya commit edilmez)
        shell: pwsh
        run: |
          $toml = "crates/cli/Cargo.toml"
          (Get-Content $toml) -replace '^version = ".*"$', "version = `"$env:VERSION`"" | Set-Content $toml
          Select-String -Path $toml -Pattern '^version = '
      - run: cargo build --release
      - name: İkon ve sürüm bilgisi exe'ye gömülmüş mü
        shell: pwsh
        run: |
          $info = (Get-Item target/release/shock-convert.exe).VersionInfo
          if ($info.ProductName -ne "Shock Convert") {
            throw "Kaynak (ikon/surum) exe'ye gomulmemis: ProductName='$($info.ProductName)'"
          }
          if ($info.CompanyName -ne "Suleyman Kara") {
            throw "Yayinci adi yanlis: CompanyName='$($info.CompanyName)'"
          }
          if ($info.ProductVersion -ne $env:VERSION) {
            throw "Surum yanlis: ProductVersion='$($info.ProductVersion)', beklenen '$env:VERSION'"
          }
          Write-Host "Gomulu kaynak tamam: $($info.ProductName) $($info.ProductVersion)"
      - name: Windows'ta dönüştürme (PNG -> JPG -> WebP)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "convert-smoke"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item assets/icon.png (Join-Path $d "ornek.png")
          $env:SHOCK_CONVERT_CONFIG_DIR = Join-Path $d "cfg"
          $exe = "target/release/shock-convert.exe"
          # Exe bir GUI uygulaması (konsol açmaz); PowerShell beklemesin diye -Wait.
          Start-Process $exe -ArgumentList "run", "jpg", (Join-Path $d "ornek.png") -Wait -NoNewWindow
          Start-Process $exe -ArgumentList "run", "webp", (Join-Path $d "ornek.jpg") -Wait -NoNewWindow
          Get-ChildItem $d | Format-Table Name, Length
          if (-not (Test-Path (Join-Path $d "ornek.webp"))) {
            Get-Content (Join-Path $env:LOCALAPPDATA "ShockConvert\log.txt") -Tail 20
            throw "PNG -> JPG -> WebP calismadi"
          }
          exit 0
      - name: Ayarlar sunucusu Windows'ta çalışıyor mu
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "settings-smoke"
          New-Item -ItemType Directory -Force $d | Out-Null
          $env:SHOCK_CONVERT_CONFIG_DIR = Join-Path $d "cfg"
          $out = Join-Path $d "url.txt"
          $p = Start-Process target/release/shock-convert.exe -ArgumentList "settings", "--print-url" -RedirectStandardOutput $out -PassThru
          for ($i = 0; $i -lt 50; $i++) {
            if ((Test-Path $out) -and (Get-Content $out -Raw)) { break }
            Start-Sleep -Milliseconds 200
          }
          $url = (Get-Content $out | Select-Object -First 1).Trim()
          Write-Host "Adres: $($url -replace 't=.*', 't=...')"
          $page = Invoke-WebRequest -Uri $url -UseBasicParsing
          if ($page.StatusCode -ne 200 -or $page.Content -notmatch "Shock Convert") { throw "ayarlar sayfasi gelmedi" }
          $token = ([uri]$url).Query -replace '^\?t=', ''
          $base = $url -replace '/\?t=.*$', ''
          $state = Invoke-RestMethod -Uri "$base/api/state" -Headers @{ "X-Token" = $token }
          Write-Host "tarayici: $($state.browser)"
          if (-not $state.browser) { throw "Edge bulunamadi" }
          Invoke-RestMethod -Method Post -Uri "$base/api/close" -Headers @{ "X-Token" = $token } | Out-Null
          if (-not $p.WaitForExit(10000)) { $p.Kill(); throw "sunucu kapanmadi" }
          exit 0
      - name: Kurulum sihirbazı (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\shock-convert.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC basarisiz: $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: shock-convert-windows
          path: |
            dist/*.exe
            target/release/shock-convert.exe

  release:
    needs: [version, windows]
    if: needs.version.outputs.kind != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write # release ve etiket
      pull-requests: write # PR'a ön sürüm bağlantısı
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      KIND: ${{ needs.version.outputs.kind }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shock-convert-windows
      - name: Yayınla
        run: |
          files=(dist/shock-convert-setup-*.exe target/release/shock-convert.exe)
          ls -l "${files[@]}"
          case "$KIND" in
            stable)
              gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" \
                --title "Shock Convert $VERSION" --generate-notes --latest ;;
            tag)
              # Etiket elle itildi; release arayüzden açılmış olabilir (notlar oradadır, tekrar yazılmaz).
              if gh release view "$TAG" > /dev/null 2>&1; then
                gh release upload "$TAG" "${files[@]}" --clobber
              else
                gh release create "$TAG" "${files[@]}" --verify-tag \
                  --title "Shock Convert $VERSION" --generate-notes
              fi ;;
            pr)
              pr="${TAG#pr-}"
              sha="${{ github.event.pull_request.head.sha }}"
              gh release delete "$TAG" --cleanup-tag --yes > /dev/null 2>&1 || true
              gh release create "$TAG" "${files[@]}" --target "$sha" --prerelease --latest=false \
                --title "PR #$pr önizleme ($VERSION)" \
                --notes "#$pr numaralı PR'ın test derlemesi (commit ${sha:0:7}). Kararlı sürüm değildir; PR kapanınca silinir."
              url="https://github.com/${GH_REPO}/releases/tag/${TAG}"
              body="**Test derlemesi hazır:** [${VERSION}](${url}) (commit ${sha:0:7}). Her push'ta güncellenir."
              gh pr comment "$pr" --edit-last --body "$body" 2> /dev/null || gh pr comment "$pr" --body "$body" ;;
          esac
          echo "Yayınlandı: https://github.com/${GH_REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [version, release]
    if: needs.version.outputs.kind == 'stable' || needs.version.outputs.kind == 'tag'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-download.yml
    with:
      tag: ${{ needs.version.outputs.tag }}

  # Kararlı sürümü winget'e gönderir: microsoft/winget-pkgs deposuna yeni sürümün manifestiyle PR açar.
  # Ön koşullar (bkz. docs/WINGET.md): paketin ilk sürümü winget'te olmalı, hesapta winget-pkgs fork'u
  # bulunmalı ve WINGET_TOKEN secret'ı (klasik PAT, public_repo) tanımlı olmalı. Secret yoksa atlanır.
  winget:
    needs: [version, release]
    if: needs.version.outputs.kind == 'stable'
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: WINGET_TOKEN tanımlı mı
        id: token
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "WINGET_TOKEN tanımlı değil; winget'e gönderilmedi." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        if: steps.token.outputs.ok == 'true'
        with:
          identifier: SuleymanKara.ShockConvert
          release-tag: ${{ needs.version.outputs.tag }}
          installers-regex: 'shock-convert-setup-.*\.exe$'
          max-versions-to-keep: 3
          token: ${{ secrets.WINGET_TOKEN }}
